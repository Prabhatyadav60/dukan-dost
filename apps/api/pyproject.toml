[project]
name = "dukan-dost-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "motor>=3.5",
  "mongomock-motor>=0.0.34",
  "pyjwt>=2.8",
  "httpx>=0.27",
  "tenacity>=8.3",
  "rapidfuzz>=3.9",
  "python-multipart>=0.0.9",
  "anthropic[bedrock]>=0.70",
  "langgraph>=0.2",
  "structlog>=24.1",
  "dnspython>=2.9.1",
  "imageio-ffmpeg>=0.7.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 110
